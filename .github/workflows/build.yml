name: Build APK

# Push a tag like v0.1.0 to publish a release (Obtainium picks it up).
# Run manually from the Actions tab for a test build without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 25.2.9519653
  RUBY_HOST_VERSION: 3.1.0

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;3.22.1" "platforms;android-33" "build-tools;33.0.1" > /dev/null

      # Cross-compiling Ruby needs a host Ruby of the same version
      - name: Cache host Ruby
        id: hostruby
        uses: actions/cache@v4
        with:
          path: ~/.local/ruby31
          key: hostruby-${{ env.RUBY_HOST_VERSION }}

      - name: Build host Ruby
        if: steps.hostruby.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          curl -sSL -o r.tgz "https://cache.ruby-lang.org/pub/ruby/3.1/ruby-$RUBY_HOST_VERSION.tar.gz"
          tar -xzf r.tgz && cd "ruby-$RUBY_HOST_VERSION"
          ./configure --prefix="$HOME/.local/ruby31" --disable-install-doc > /dev/null
          make -j"$(nproc)" > /dev/null && make install > /dev/null

      - name: Cache native dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            app/jni/libiconv
            app/jni/libogg
            app/jni/libtheora
            app/jni/libvorbis
            app/jni/openal
            app/jni/openssl
            app/jni/physfs
            app/jni/pixman
            app/jni/ruby
            app/jni/SDL2
            app/jni/SDL2_image
            app/jni/SDL2_sound
            app/jni/SDL2_ttf
            app/jni/uchardet
            app/jni/build-arm64-v8a
          key: deps-${{ env.NDK_VERSION }}-${{ hashFiles('app/jni/get_deps.sh', 'app/jni/Makefile') }}

      - name: Build native dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: app/jni
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ARCH=linux-x86_64
          export PATH="$HOME/.local/ruby31/bin:$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          bash get_deps.sh
          make all

      - name: Generate embedded engine assets
        working-directory: app/jni/mkxp-z
        run: bash make_xxd.sh > /dev/null

      - name: Build APK
        env:
          PIF_KEYSTORE_B64: ${{ secrets.PIF_KEYSTORE_B64 }}
          PIF_KEYSTORE_PASS: ${{ secrets.PIF_KEYSTORE_PASS }}
        run: |
          echo "$PIF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export PIF_KEYSTORE="$RUNNER_TEMP/release.jks"
          export PIF_VERSION_CODE="${{ github.run_number }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export PIF_VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export PIF_VERSION_NAME="0.0.${{ github.run_number }}-dev"
          fi
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/InfiniteFusion-$PIF_VERSION_NAME.apk"
          rm -f "$PIF_KEYSTORE"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
